<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fermata × Nexceris</title>
  <meta name="description" content="How Fermata works, in two minutes: a film made for Nexceris.">
  <meta name="theme-color" content="#f4f4f1">
  <!-- A page for one company, shared by link. Kept out of search results. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <style>
    /* the main site's light palette, so this page reads as part of getfermata.app */
    :root {
      color-scheme: light;
      --bg: oklch(96.6% 0.004 106.5);
      --surface: oklch(99.1% 0.0013 106.5);
      --white: oklch(100% 0 0);
      --ink: oklch(22% 0.010 286);
      --ink-2: oklch(45.2% 0.013 286);
      --ink-3: oklch(58.2% 0.012 286);
      --line: rgb(26 26 31 / 0.137);
      --line-2: rgb(26 26 31 / 0.269);
      --violet: oklch(43.3% 0.167 283.6);
      --violet-2: oklch(54.1% 0.156 286.1);
      --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
      /* the faint notebook grid of the main site */
      background-image: radial-gradient(circle at 1px 1px, rgba(26, 26, 31, 0.07) 1px, transparent 0);
      background-size: 28px 28px;
    }
    .glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(60rem 34rem at 50% -10rem, rgba(106, 92, 196, 0.12), transparent 70%); }
    header, main { position: relative; }
    .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 32px; }
    header { border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-family: var(--serif); font-size: 21px; }
    .brand svg { color: var(--violet); }
    .header-cta { padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 15px; font-weight: 500; text-decoration: none; }
    main { padding-block: clamp(40px, 8vh, 88px) 88px; }

    /* Fermata × Nexceris: the two marks side by side, each in its own type */
    .pair { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 3vw, 34px); margin: 0 auto 30px; }
    .pair .fermata { display: inline-flex; align-items: center; gap: 12px; font-family: var(--serif); font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -0.01em; }
    .pair .fermata svg { width: clamp(30px, 3.8vw, 42px); height: auto; color: var(--violet); }
    .pair .x { font-family: var(--sans); font-weight: 300; font-size: clamp(22px, 2.6vw, 30px); color: var(--ink-3); }
    .pair .nexceris { display: inline-flex; align-items: center; gap: 2px; font-family: "Montserrat", var(--sans); font-size: clamp(24px, 3.1vw, 35px); letter-spacing: 0.01em; color: #05070d; }
    .pair .nexceris svg { width: clamp(30px, 3.8vw, 42px); height: auto; margin-right: 4px; }
    .pair .nexceris b { font-weight: 600; }
    .pair .nexceris span { font-weight: 300; }

    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4.4vw, 50px); line-height: 1.1; letter-spacing: -0.02em; text-align: center; margin: 0 auto 36px; }
    em { font-style: italic; color: var(--violet); }
    .player { position: relative; max-width: 1040px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: var(--white); border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(26, 26, 31, 0.04), 0 40px 90px -40px rgba(26, 26, 31, 0.35); }
    .player video { display: block; width: 100%; height: 100%; }
    .play { position: absolute; inset: 0; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; background: linear-gradient(to top, rgba(26, 26, 31, 0.18), rgba(26, 26, 31, 0.02)); }
    .play span { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--white); color: var(--ink); box-shadow: 0 14px 40px -10px rgba(26, 26, 31, 0.45); transition: transform 0.2s; }
    .play svg { width: 28px; height: 28px; margin-left: 4px; }
    .play:hover span { transform: scale(1.05); }
    .player.playing .play { display: none; }
    .cta { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .cta a { display: inline-flex; align-items: center; gap: 9px; padding: 15px 26px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
      color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none; transition: border-color 0.2s, background 0.2s; }
    .cta a:hover { border-color: var(--violet-2); background: var(--white); }
    .cta svg { width: 13px; height: 13px; color: var(--violet); }
    @media (max-width: 760px) { .wrap { padding-inline: 20px; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header>
    <div class="wrap">
      <a class="brand" href="/" aria-label="Fermata">
        <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><path d="M6 28 A18 18 0 0 1 42 28" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="13" cy="28" r="3.4" fill="currentColor"/><circle cx="24" cy="28" r="3.4" fill="currentColor"/><circle cx="35" cy="28" r="3.4" fill="currentColor"/></svg>
        Fermata
      </a>
      <a class="header-cta" href="mailto:hi@getfermata.app?subject=Fermata%20%C3%97%20Nexceris">Contact us</a>
    </div>
  </header>
  <main class="wrap">
    <p class="pair" aria-label="Fermata and Nexceris">
      <span class="fermata"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 28 A18 18 0 0 1 42 28" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="13" cy="28" r="3.4" fill="currentColor"/><circle cx="24" cy="28" r="3.4" fill="currentColor"/><circle cx="35" cy="28" r="3.4" fill="currentColor"/></svg>Fermata</span>
      <span class="x" aria-hidden="true">×</span>
      <span class="nexceris"><svg viewBox="30 50 525 525" aria-hidden="true"><g fill="currentColor"><path d="M35 314 165 199v234z"/><path d="M205 170 335 55v230z"/><path d="M550 311 420 427V196z"/><path d="M380 455 250 570V340z"/></g></svg><b>NEX</b><span>CERIS</span></span>
    </p>
    <h1>How Fermata works, <em>in two minutes</em>.</h1>
    <div class="player">
      <video src="../assets/fermata-story-film.mp4" poster="../assets/fermata-story-film-poster.jpg" preload="none" playsinline
             aria-label="How Fermata works: a pilot-line engineer at Northfield Materials finds why output dropped, from what the lab and the plant already learned."></video>
      <button class="play" type="button" aria-label="Play the film">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></span>
      </button>
    </div>
    <div class="cta">
      <a href="https://web.getfermata.app"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Try demo</a>
      <a href="mailto:hi@getfermata.app?subject=Fermata%20%C3%97%20Nexceris"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4.5 7l7.5 6 7.5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Contact us</a>
    </div>
  </main>
  <script>
    (() => {
      const player = document.querySelector(".player");
      const video = player.querySelector("video");
      player.querySelector(".play").addEventListener("click", () => { player.classList.add("playing"); video.controls = true; video.play(); });
    })();
  </script>
</body>
</html>
