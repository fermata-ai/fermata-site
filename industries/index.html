<title>Fermata · Industries</title>
<style>
/* The industries page. It is the landing page's sister: the same paper, type, masthead, buttons and footer
   (the values below are the landing page's own, from ../index.html), so the two read as one site. */
:root {
  color-scheme: light;
  --bg: oklch(96.6% 0.004 106.5); --surface: oklch(99.1% 0.0013 106.5); --white: oklch(100% 0 0); --sunk: oklch(94.2% 0.0053 106.5);
  --line: rgb(26 26 31 / 0.137); --line-2: rgb(26 26 31 / 0.269);
  --ink: oklch(22% 0.010 286); --ink-2: oklch(45.2% 0.013 286); --ink-3: oklch(58.2% 0.012 286);
  --violet: oklch(43.3% 0.167 283.6); --violet-2: oklch(54.1% 0.156 286.1); --violet-soft: oklch(94.4% 0.023 296.7); --violet-line: oklch(88% 0.048 294.5);
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --shadow: 0 1px 0 rgba(26, 26, 31, 0.03), 0 18px 48px -22px rgba(26, 26, 31, 0.22);
  --ease: cubic-bezier(0.22, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  /* a faint notebook grid behind everything */
  background-image: radial-gradient(circle at 1px 1px, rgba(26, 26, 31, 0.07) 1px, transparent 0);
  background-size: 28px 28px;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 32px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--violet); margin: 0 0 16px; }
.eyebrow .n { font-family: var(--mono); letter-spacing: 0; margin-right: 6px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
em { font-style: italic; color: var(--violet); }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 6px; }

/* ---------- masthead ---------- */
.top { position: relative; z-index: 3; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 21px; }
.brand svg { color: var(--violet); }
.nav { display: flex; align-items: center; gap: 22px; }
.nav a { font-size: 14px; text-decoration: none; color: var(--ink-2); transition: color 0.2s; }
.nav a:hover, .nav a[aria-current] { color: var(--ink); }
.nav a[aria-current] { font-weight: 500; }
.header-cta { padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--white) !important; font-weight: 500; }
.header-cta:hover { background: #2c2c33; }

/* ---------- buttons ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.cta { display: inline-flex; align-items: center; gap: 10px; padding: 15px 28px; border-radius: 999px; background: var(--ink); color: var(--white);
  font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 12px 30px -14px rgba(26, 26, 31, 0.55); transition: transform 0.2s, background 0.2s; }
.cta:hover { transform: translateY(-1px); background: #2c2c33; }
.cta-ghost { display: inline-flex; align-items: center; gap: 9px; padding: 15px 26px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none; transition: border-color 0.2s, background 0.2s; }
.cta-ghost:hover { border-color: var(--violet-2); background: var(--white); }


/* the faintest line, round a photograph: the landing page's soft hairline */
:root { --hair: rgb(26 26 31 / 0.083); }

/* ---------- first screen: the promise, over one photograph that gives way to the next industry's, slowly ---------- */
.stage { position: relative; max-width: 1180px; margin: clamp(20px, 3.4vh, 36px) auto 0; padding-inline: 32px; }
.frame { position: relative; height: clamp(240px, 42svh, 440px); overflow: hidden; border-radius: 8px; background: var(--sunk); }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; scale: 1.06; transition: opacity 1.5s var(--ease), scale 8s linear; }
.frame img.on { opacity: 1; scale: 1; }
.frame .cap { display: none; } .frame .cap-off { position: absolute; left: 20px; bottom: 18px; z-index: 1; color: var(--white); font-family: var(--serif); font-size: clamp(20px, 2vw, 28px); letter-spacing: -0.01em; text-shadow: 0 1px 18px rgb(0 0 0 / 0.45); transition: opacity 0.6s; }
.frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top in oklch, rgb(16 14 28 / 0.55), rgb(16 14 28 / 0) 40%); }
.index a.peek { color: var(--ink); } .index a.peek .n { color: var(--violet); } .index a.peek::after { transform: scaleX(1); transition-duration: 4.2s; transition-timing-function: linear; }
.hero { position: relative; padding-top: clamp(40px, 8vh, 88px); }
.hero-copy { position: relative; text-align: center; max-width: 980px; margin: 0 auto clamp(16px, 3vh, 32px); padding-inline: 24px; }
/* the words that change: they keep two lines of room, so nothing under them moves */
.swapbox { display: block; min-height: 2.1em; }
#swap { display: inline-block; transition: opacity 0.45s var(--ease), transform 0.45s var(--ease); }
#swap.out { opacity: 0; transform: translateY(-0.22em); }
h1 { font-size: clamp(40px, 6.2vw, 80px); line-height: 1.02; letter-spacing: -0.035em; margin-bottom: 22px; }
.lede { font-family: var(--serif); font-weight: 300; font-size: clamp(18px, 2vw, 22px); line-height: 1.45; color: var(--ink-2); max-width: 600px; margin: 0 auto; }
.hero-copy > * { animation: rise 0.6s var(--ease) backwards; }
.hero-copy > :nth-child(2) { animation-delay: 0.05s; } .hero-copy > :nth-child(3) { animation-delay: 0.1s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- the five industries, as one line of names that stays at the top ---------- */
.index { position: sticky; top: 0; z-index: 4; background: rgb(244 244 241 / 0.94); border-block: 1px solid var(--line); }
.index ol { list-style: none; margin: 0 auto; padding: 0 32px; width: fit-content; max-width: min(1180px, 100%); display: flex; gap: clamp(16px, 3vw, 40px); overflow-x: auto; scrollbar-width: none; }
.index ol::-webkit-scrollbar { display: none; }
.index a { position: relative; display: block; padding: 16px 0 15px; white-space: nowrap; text-decoration: none; font-size: 14px; color: var(--ink-3); transition: color 0.3s; }
.index a .n { font-family: var(--mono); font-size: 11px; font-weight: 600; margin-right: 8px; color: var(--ink-3); transition: color 0.3s; }
.index a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--violet); transform: scaleX(0); transform-origin: left; transition: transform 0.5s var(--ease); }
.index a:hover, .index a.now { color: var(--ink); }
.index a.now .n { color: var(--violet); }
.index a.now::after { transform: scaleX(1); }

/* ---------- what every industry is measured by: said once ---------- */
.say { text-align: center; padding-block: clamp(80px, 14vh, 150px) clamp(24px, 5vh, 56px); }
.say h2 { font-size: clamp(32px, 3.8vw, 50px); line-height: 1.06; max-width: 760px; margin: 0 auto; }

main { overflow-x: clip; }
/* ---------- one industry: its name and what its teams are measured by, and its photographs gathering beside them ---------- */
.ind { scroll-margin-top: 72px; padding-block: clamp(56px, 10vh, 120px); }
.ind > .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 5vw, 80px); align-items: center; }
.ind h2 { font-size: clamp(32px, 3.6vw, 50px); line-height: 1.06; margin-bottom: 28px; }
/* the six measures: one a line, numbered. A measure's unit stays in its brackets after the name, in quieter ink. */
.kh { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.kpis { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-2); }
.kpis li { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: baseline; column-gap: 12px; padding: 13px 0 14px; border-bottom: 1px solid var(--line); }
.kpis .ix { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--violet); }
.kpis .nm { font-size: 16.5px; font-weight: 500; line-height: 1.35; }
.kpis .un { font-weight: 400; color: var(--ink-3); }
.js .kpis li { opacity: 0; translate: 0 8px; transition: opacity 0.6s var(--ease), translate 0.6s var(--ease); transition-delay: calc(var(--i) * 70ms); }
.js .ind.shown .kpis li { opacity: 1; translate: 0 0; }
/* the photographs: every one of them, fitted together. They come from where they lay and close up as the industry arrives. */
.collage { display: grid; gap: 8px; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: clamp(84px, 9.4vw, 132px); }
.collage figure { margin: 0; border-radius: 10px; overflow: hidden; background: var(--sunk); box-shadow: 0 0 0 1px var(--hair), 0 18px 40px -28px rgb(26 26 31 / 0.55); will-change: transform; }
.collage img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* how four, five and six photographs fit: never the same block twice in a row */
.c4 figure:nth-child(1) { grid-area: 1 / 1 / 4 / 8; } .c4 figure:nth-child(2) { grid-area: 1 / 8 / 3 / 13; }
.c4 figure:nth-child(3) { grid-area: 3 / 8 / 5 / 13; } .c4 figure:nth-child(4) { grid-area: 4 / 1 / 5 / 8; }
.c5 figure:nth-child(1) { grid-area: 1 / 1 / 3 / 6; } .c5 figure:nth-child(2) { grid-area: 1 / 6 / 4 / 13; }
.c5 figure:nth-child(3) { grid-area: 3 / 1 / 5 / 6; } .c5 figure:nth-child(4) { grid-area: 4 / 6 / 5 / 10; } .c5 figure:nth-child(5) { grid-area: 4 / 10 / 5 / 13; }
.c6 figure:nth-child(1) { grid-area: 1 / 1 / 3 / 8; } .c6 figure:nth-child(2) { grid-area: 1 / 8 / 2 / 13; }
.c6 figure:nth-child(3) { grid-area: 2 / 8 / 4 / 13; } .c6 figure:nth-child(4) { grid-area: 3 / 1 / 5 / 5; }
.c6 figure:nth-child(5) { grid-area: 3 / 5 / 4 / 8; } .c6 figure:nth-child(6) { grid-area: 4 / 5 / 5 / 13; }
.ind.flip .collage { order: -1; }

/* ---------- close ---------- */
.close { text-align: center; padding-block: clamp(90px, 16vh, 170px); }
.close h2 { font-size: clamp(34px, 4.6vw, 60px); line-height: 1.05; max-width: 900px; margin: 0 auto 18px; }
.close p { font-family: var(--serif); font-weight: 300; font-size: 20px; color: var(--ink-2); margin: 0 auto 34px; max-width: 620px; }

footer { border-top: 1px solid var(--line); }
footer .wrap.f { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; padding-block: 28px; font-size: 14px; color: var(--ink-3); }
footer nav { display: flex; gap: 22px; flex-wrap: wrap; }
footer a { text-decoration: none; color: var(--ink-2); }
footer a:hover { color: var(--ink); }
.credits { font-size: 12px; color: var(--ink-3); line-height: 1.6; padding-bottom: 36px; }
.credits a { color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--line-2); }


@media (max-width: 899px) {
  .nav .hide-s { display: none; }
  .wrap { padding-inline: 16px; }
  .stage { padding-inline: 16px; } .frame { height: 220px; }
  .index ol { padding-inline: 16px; }
  .ind > .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .ind .collage, .ind.flip .collage { order: -1; }
  .collage { grid-auto-rows: 22vw; gap: 6px; }
}
@media (max-width: 560px) {
  .nav { gap: 14px; } .nav .hide-xs { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero-copy > * { animation: none; }
  .frame img { transition: none; scale: 1; } #swap { transition: none; }
  .js .kpis li { opacity: 1; translate: 0 0; transition: none; }
  .index a::after { transition: none; }
}
</style>
<script>document.documentElement.classList.add("js");</script>
</head>

<script>
(function () {
  var C = window.FERMATA_INDUSTRIES, BASE = "";
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = function (t, c, s) { var e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; };
  var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  document.getElementById("closeh").textContent = C.closeHeading;
  document.getElementById("closep").textContent = C.closeText;
  // the heading every industry shares, said once, with its last word in the landing page's violet italic
  var say = (C.industries[0].goalsHeading || "Turn every result into progress against your KPIs").replace(/\.$/, "");
  var cut = say.lastIndexOf(" "), sayEl = document.getElementById("say");
  sayEl.appendChild(document.createTextNode(say.slice(0, cut + 1))); sayEl.appendChild(el("em", null, say.slice(cut + 1))); sayEl.appendChild(document.createTextNode("."));

  // ---- first screen: one photograph, then the next industry's. The line of names under it follows, and a name under the pointer brings its own.
  var frameEl = document.getElementById("frame"), capEl = document.getElementById("cap"), SHOTS = [], shot = -1, timer = 0;
  C.industries.forEach(function (d, i) { var im = new Image(); im.src = BASE + d.photos[0].src; im.alt = ""; im.decoding = "async"; frameEl.insertBefore(im, capEl); SHOTS.push(im); });
  function show(i) {
    if (i === shot) return; shot = i;
    SHOTS.forEach(function (im, j) { im.classList.toggle("on", j === i); });
    var sw = document.getElementById("swap"), nm = C.industries[i].name, word = nm.charAt(0).toLowerCase() + nm.slice(1) + ".";
    if (!sw.textContent || still) sw.textContent = word; else { sw.classList.add("out"); setTimeout(function () { sw.textContent = word; sw.classList.remove("out"); }, 420); }
    var links = document.querySelectorAll("#index a"); links.forEach(function (a, j) { a.classList.toggle("peek", j === i && scrollY < 200); });
  }
  function next() { show((shot + 1) % SHOTS.length); }
  // once the page has moved on, the line of names marks where the reader is, not which photograph is showing
  addEventListener("scroll", function () { if (scrollY >= 200) { var pk = document.querySelector("#index a.peek"); if (pk) pk.classList.remove("peek"); } }, { passive: true });
  setTimeout(function () {
    show(0); if (!still) timer = setInterval(function () { if (scrollY < innerHeight) next(); }, 4200);
    document.querySelectorAll("#index a").forEach(function (a, j) { a.addEventListener("pointerenter", function () { if (scrollY < innerHeight) { clearInterval(timer); show(j); } }); });
  }, 0);

  // ---- the industries
  var main = document.getElementById("inds"), idx = document.getElementById("index"), CH = [];
  C.industries.forEach(function (d, i) {
    var no = "0" + (i + 1);
    var li = el("li"), a = el("a"); a.href = "#" + d.id; a.appendChild(el("span", "n", no)); a.appendChild(document.createTextNode(d.name)); li.appendChild(a); idx.appendChild(li);
    var s = el("section", "ind" + (i % 2 ? " flip" : "")); s.id = d.id;
    var w = el("div", "wrap"), text = el("div", "text"), eb = el("p", "eyebrow");
    eb.appendChild(el("span", "n", no)); eb.appendChild(document.createTextNode("Industry"));
    text.appendChild(eb); text.appendChild(el("h2", null, d.name.replace(/-/g, "\u2011")));
    // a measure that ends in brackets keeps them; only their ink is quieter. The words are the content file's own.
    text.appendChild(el("p", "kh", "KPIs"));
    var ul = el("ul", "kpis"); d.goals.forEach(function (g, j) {
      var r = el("li"), m = /^(.*\S)(\s*\([^()]*\))$/.exec(g), nm = el("span", "nm", m ? m[1] : g); r.style.setProperty("--i", j);
      if (m) nm.appendChild(el("span", "un", m[2]));
      r.appendChild(el("span", "ix", "0" + (j + 1))); r.appendChild(nm); ul.appendChild(r);
    });
    text.appendChild(ul);
    var n = Math.min(6, Math.max(4, d.photos.length)), col = el("div", "collage c" + n), figs = [];
    d.photos.slice(0, n).forEach(function (p, j) {
      var f = el("figure"), im = new Image(); im.src = BASE + p.src; im.alt = p.alt; im.loading = "lazy"; im.decoding = "async"; f.appendChild(im); col.appendChild(f);
      // where this print lay before it was gathered: out from the middle, lower, turned, smaller. Seeded, so it is the same every visit.
      var a1 = Math.sin((i + 1) * 12.9898 + (j + 1) * 78.233) * 43758.5453, r1 = a1 - Math.floor(a1), a2 = Math.sin((i + 3) * 39.3468 + (j + 2) * 11.135) * 24634.6345, r2 = a2 - Math.floor(a2);
      figs.push({ el: f, rx: r1 * 2 - 1, ry: r2, rot: (r1 * 2 - 1) * 9, late: j * 0.09 });
    });
    w.appendChild(text); w.appendChild(col); s.appendChild(w); main.appendChild(s);
    CH.push({ el: s, col: col, figs: figs, link: a, top: 0, h: 0, cx: 0, p: -1, shown: false });
  });

  // photographs whose licence asks for a credit are named in the footer
  var cr = C.heroPhotos.concat.apply(C.heroPhotos, C.industries.map(function (d) { return d.photos; })).filter(function (p) { return p.credit; });
  if (cr.length) {
    var cb = document.getElementById("credits"); cb.appendChild(document.createTextNode("Photo credits: "));
    cr.forEach(function (p, j) {
      var a = el("a", null, p.alt); a.href = p.credit.page; cb.appendChild(a);
      cb.appendChild(document.createTextNode(", " + p.credit.author + ", "));
      if (p.credit.licenceUrl) { var l = el("a", null, p.credit.licence); l.href = p.credit.licenceUrl; cb.appendChild(l); } else cb.appendChild(document.createTextNode(p.credit.licence));
      cb.appendChild(document.createTextNode(j < cr.length - 1 ? "; " : "."));
    });
  }

  // ---- what the scroll moves. One handler: it reads the page once (on load and resize), then only writes.
  var vh = 0, heroH = 0, raf = 0, phone = false;
  function measure() {
    vh = innerHeight; phone = innerWidth < 900; heroH = document.getElementById("hero").offsetHeight;
    CH.forEach(function (c) { c.figs.forEach(function (f) { f.el.style.transform = ""; }); });
    CH.forEach(function (c) {
      var r = c.col.getBoundingClientRect(), sr = c.el.getBoundingClientRect();
      c.top = r.top + scrollY; c.h = r.height; c.stop = sr.top + scrollY; c.sbot = sr.bottom + scrollY; c.w = r.width;
      c.figs.forEach(function (f) { var fr = f.el.getBoundingClientRect(); f.ox = (fr.left + fr.width / 2) - (r.left + r.width / 2); f.oy = (fr.top + fr.height / 2) - (r.top + r.height / 2); });
    });
    CH.forEach(function (c) { c.p = -1; });
    frame();
  }
  function frame() {
    raf = 0;
    var y = scrollY, now = null;
    for (var k = 0; k < CH.length; k++) {
      var c = CH[k];
      if (y + vh * 0.5 >= c.stop && y + vh * 0.5 < c.sbot) now = c;
      if (!c.shown && y + vh * 0.78 > c.stop) { c.shown = true; c.el.classList.add("shown"); }
      if (still) continue;
      // 0 as the collage's top edge comes over the bottom of the screen, 1 when it has risen most of the way
      var p = clamp((y + vh - c.top - vh * 0.04) / (vh * (phone ? 0.5 : 0.62)));
      if (Math.abs(p - c.p) < 0.002) continue;
      c.p = p;
      var spread = phone ? 0.5 : 1;
      for (var j = 0; j < c.figs.length; j++) {
        var f = c.figs[j], t = ease(clamp((p - f.late * 0.55) / (1 - 0.3))), u = 1 - t;
        if (u < 0.001) { f.el.style.transform = ""; f.el.style.opacity = ""; continue; }
        var dx = (f.ox * 0.55 + f.rx * 90) * u * spread, dy = (120 + f.ry * 190 + Math.abs(f.oy) * 0.3) * u * spread;
        f.el.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) rotate(" + (f.rot * u).toFixed(2) + "deg) scale(" + (1 - 0.14 * u).toFixed(3) + ")";
        f.el.style.opacity = clamp(t * 2.2).toFixed(3);
      }
    }
    for (var m = 0; m < CH.length; m++) CH[m].link.classList.toggle("now", CH[m] === now);
  }
  function tick() { if (!raf) raf = requestAnimationFrame(frame); }
  addEventListener("scroll", tick, { passive: true });
  addEventListener("resize", measure); addEventListener("load", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  // a photograph's size is known only once it has loaded: measure again as the page fills in
  var late = 0; document.addEventListener("load", function (e) { if (e.target.tagName === "IMG") { clearTimeout(late); late = setTimeout(measure, 120); } }, true);
  measure();
})();
</script>
