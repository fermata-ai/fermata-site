# Publishes the site to GitHub Pages. The PostHog key is not in the repo: this job puts the POSTHOG_KEY
# secret in place of __POSTHOG_KEY__ in the copy it publishes. Without the secret the page still deploys
# and simply sends no analytics.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the published copy
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          mkdir _site
          cp -R index.html guide assets CNAME .nojekyll _site/
          if [ -n "$POSTHOG_KEY" ]; then
            sed -i "s/__POSTHOG_KEY__/${POSTHOG_KEY}/" _site/index.html _site/guide/index.html
          else
            echo "::warning::POSTHOG_KEY secret is not set; the site deploys without analytics"
          fi
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
