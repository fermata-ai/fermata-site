# Publishes the site to the web machine on AWS and, until DNS has moved there, to GitHub Pages too. The
# machine's job needs the repository variable FERMATA_SITE_DEPLOY_ROLE (`make web-stack` in fermata-ai/fermata
# sets it) and is skipped without it. No AWS key is stored in GitHub. A rollback is a re-run of an earlier run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the published copy
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4

  # No `environment` here: the role accepts this repository's main branch by name, and an environment
  # would change the name GitHub gives the run.
  machine:
    if: vars.FERMATA_SITE_DEPLOY_ROLE != ''
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-1
      STACK: fermata-web
    steps:
      - uses: actions/checkout@v4
      - name: Build the published copy
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: ./build.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FERMATA_SITE_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: The stack's names
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "repo=$(output SiteImageRepository)" >> "$GITHUB_OUTPUT"
          echo "document=$(output SiteDeployDocument)" >> "$GITHUB_OUTPUT"
          echo "instance=$(output InstanceId)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REPO: ${{ steps.stack.outputs.repo }}
        run: |
          docker build --tag "$REPO:$GITHUB_SHA" .
          docker push "$REPO:$GITHUB_SHA"

      - name: Run it on the machine
        env:
          DOCUMENT: ${{ steps.stack.outputs.document }}
          INSTANCE: ${{ steps.stack.outputs.instance }}
        run: |
          id="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name "$DOCUMENT" \
            --parameters "tag=$GITHUB_SHA" --query Command.CommandId --output text)"
          while :; do
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "==> $status"
          [ "$status" = Success ]
